<script>
// ---------- Κίνηση με ανθρώπινο χαρακτήρα (Quaternius, CC0) και αντίστροφη κινηματική ----------
// Σύστημα: ο χαρακτήρας κοιτάει προς +z, αριστερά = +x, πάνω = +y, έδαφος y = 0, μονάδες μέτρα.
// Κάθε άσκηση ορίζει στόχους (πού βρίσκονται λεκάνη/ώμοι, χέρια, πόδια) στη θέση A (αρχή προσπάθειας) και B (τέλος).
// Οι γωνίες των αρθρώσεων υπολογίζονται με αντίστροφη κινηματική δύο οστών, με ρητή κατεύθυνση αγκώνα/γονάτου (pole).
const QV = (x, y, z) => new THREE.Vector3(x, y, z);
const QD = Math.PI / 180;
// Ευθυγράμμιση δύο ζευγών διανυσμάτων: R*a1 = a2 και R*b1 (κάθετο στο a1) = b2 (κάθετο στο a2)
function qAlign(a1, b1, a2, b2) {
  const basis = (a, b) => { const x = a.clone().normalize(), y = b.clone().sub(x.clone().multiplyScalar(b.dot(x))).normalize(), z = x.clone().cross(y); return new THREE.Matrix4().makeBasis(x, y, z); };
  const M1 = basis(a1, b1), M2 = basis(a2, b2);
  return new THREE.Quaternion().setFromRotationMatrix(M2.multiply(M1.transpose()));
}
const perpOf = (v, ref) => { const r = ref.clone().normalize(); return v.clone().sub(r.multiplyScalar(v.dot(r))); };
function qSetWorld(b, qw) { const pq = b.parent.getWorldQuaternion(new THREE.Quaternion()); b.quaternion.copy(pq.invert().multiply(qw)); b.updateMatrixWorld(true); }
const wpos = b => b.getWorldPosition(QV(0, 0, 0)), wquat = b => b.getWorldQuaternion(new THREE.Quaternion());

function qInit(root) {
  const B = {}; root.traverse(o => { if (o.isBone) B[o.name] = o; });
  root.updateMatrixWorld(true);
  const R = { B, rest: {}, rq: {}, rp: {} };
  for (const n in B) { R.rest[n] = B[n].quaternion.clone(); R.rq[n] = wquat(B[n]); R.rp[n] = wpos(B[n]); }
  const P = R.rp, F = QV(0, 0, 1), sub = (a, b) => P[a].clone().sub(P[b]);
  R.len = {}; R.dir = {}; R.nrm = {};
  for (const s of ['l', 'r']) {
    R.len['ua' + s] = P['lowerarm_' + s].distanceTo(P['upperarm_' + s]);
    R.len['fa' + s] = P['hand_' + s].distanceTo(P['lowerarm_' + s]);
    R.len['th' + s] = P['calf_' + s].distanceTo(P['thigh_' + s]);
    R.len['sh' + s] = P['foot_' + s].distanceTo(P['calf_' + s]);
    R.len['hd' + s] = P['middle_01_' + s].distanceTo(P['hand_' + s]);
    R.len['ft' + s] = P['ball_' + s].distanceTo(P['foot_' + s]);
    // Κατευθύνσεις στη στάση ηρεμίας και άξονας κάμψης (αγκώνας: ο πήχης κάμπτεται προς τα εμπρός, γόνατο: η κνήμη προς τα πίσω)
    const ua = sub('lowerarm_' + s, 'upperarm_' + s).normalize(), fa = sub('hand_' + s, 'lowerarm_' + s).normalize(), hd = sub('middle_01_' + s, 'hand_' + s).normalize();
    const th = sub('calf_' + s, 'thigh_' + s).normalize(), sh = sub('foot_' + s, 'calf_' + s).normalize(), ft = sub('ball_' + s, 'foot_' + s).normalize();
    R.dir['upperarm_' + s] = ua; R.dir['lowerarm_' + s] = fa; R.dir['hand_' + s] = hd;
    R.dir['thigh_' + s] = th; R.dir['calf_' + s] = sh; R.dir['foot_' + s] = ft;
    const na = ua.clone().cross(F).normalize(), nl = th.clone().cross(F.clone().negate()).normalize();
    R.nrm['upperarm_' + s] = na; R.nrm['lowerarm_' + s] = na; R.nrm['hand_' + s] = na;

function estLevel(){

  let lv=null,src='';
  if(lifts.length){lv=LK[Math.floor(lifts.reduce((a,x)=>a+x.t,0)/lifts.length)];src='lifts'}

sapd:{P:'Στο πλάτος των ισχίων, ένα βήμα πίσω από την τροχαλία.',G:'Ελαφρά λυγισμένα.',L:'Ελαφριά κάμψη από τα ισχία, μέση ουδέτερη.',K:'Κορμός με μικρή κλίση μπροστά που μένει σταθερή, κοιλιακοί σφιχτοί.',W:'Ώμοι κάτω, μακριά από τα αυτιά, σε όλη την κίνηση.',H:'Βλέμμα μπροστά-κάτω, λαιμός ουδέτερος.',X:'Πρηνισμένη λαβή στο πλάτος των ώμων, καρποί ίσιοι.',A:'Ελαφρά λυγισμένοι και κλειδωμένοι στη γωνία αυτή — η κίνηση γίνεται μόνο από τον ώμο.',B:'Εκπνοή καθώς κατεβάζεις τη μπάρα, εισπνοή καθώς ανεβαίνει.',F:'Πλατύς ραχιαίος: φέρε τη μπάρα σε τόξο μέχρι τους μηρούς.'},
facepull:{P:'Στο πλάτος των ισχίων ή το ένα μπροστά για ισορροπία.',G:'Ελαφρά λυγισμένα.',L:'Ουδέτερη μέση, γλουτοί σφιχτοί.',K:'Κορμός όρθιος, στήθος έξω· δεν γέρνεις πίσω για να τραβήξεις.',W:'Στο τέλος οι ωμοπλάτες σφίγγουν πίσω και οι ώμοι στρέφονται προς τα έξω.',H:'Βλέμμα μπροστά, το σχοινί έρχεται προς το πρόσωπο.',X:'Σχοινί με ουδέτερη λαβή, αντίχειρες προς τα πίσω· στο τέλος τα χέρια ανοίγουν δεξιά-αριστερά από το κεφάλι.',A:'Ψηλά, στο ύψος των ώμων ή λίγο πιο πάνω.',B:'Εκπνοή καθώς τραβάς, εισπνοή στην επιστροφή.',F:'Οπίσθιοι δελτοειδείς και μέση πλάτη.'},
ohp:{P:'Πέλματα σταθερά στο έδαφος, λίγο πιο ανοιχτά από τα ισχία.',L:'Πισινός και πλάτη ακουμπούν στην πλάτη του πάγκου, μέση ουδέτερη χωρίς υπερβολική καμάρα.',K:'Στήθος έξω, κοιλιακοί σφιχτοί.',W:'Ώμοι κάτω, μακριά από τα αυτιά· δεν σηκώνονται στο πάνω σημείο.',H:'Κεφάλι ακουμπά στον πάγκο, βλέμμα μπροστά.',X:'Παλάμες μπροστά, ο αλτήρας στη βάση της παλάμης πάνω από τον πήχη, καρποί ίσιοι — όχι λυγισμένοι προς τα πίσω.',A:'Λίγο μπροστά από τον κορμό (περίπου 45°), κάτω από τους καρπούς σε όλη την κίνηση.',B:'Εκπνοή καθώς σπρώχνεις, εισπνοή καθώς κατεβάζεις.',F:'Πρόσθιοι και μέσοι δελτοειδείς.'},
latraise:{P:'Στο πλάτος των ισχίων, μύτες ευθεία.',G:'Ελαφρά λυγισμένα.',L:'Ουδέτερη μέση, γλουτοί σφιχτοί· καμία φόρα από τη μέση.',K:'Κορμός όρθιος ή ελάχιστα μπροστά, στήθος έξω.',W:'Ώμοι κάτω· οι ωμοπλάτες δεν ανεβαίνουν προς τα αυτιά.',H:'Βλέμμα μπροστά, λαιμός χαλαρός.',X:'Ουδέτερη λαβή στο ξεκίνημα, καρποί ίσιοι· στο πάνω σημείο οι αλτήρες περίπου οριζόντιοι.',A:'Ελαφρά λυγισμένοι και σταθεροί· οι αγκώνες οδηγούν την κίνηση και φτάνουν στο ύψος των ώμων.',B:'Εκπνοή καθώς ανεβάζεις, εισπνοή καθώς κατεβάζεις.',F:'Μέσος δελτοειδής.'},

squat:{P:'Λίγο πιο ανοιχτά από τους ώμους, μύτες ελαφρά έξω (15–30°), όλο το πέλμα στο έδαφος.',G:'Ακολουθούν την κατεύθυνση των ποδιών· δεν κλείνουν προς τα μέσα.',L:'Πισινός πίσω και κάτω, μέση ουδέτερη· όχι στρογγύλεμα στο κάτω σημείο.',K:'Στήθος έξω, κορμός σφιχτός.',W:'Η μπάρα πάνω στους τραπεζοειδείς, ωμοπλάτες σφιγμένες για να σχηματίσουν «ράφι».',H:'Βλέμμα μπροστά ή λίγο κάτω, λαιμός ουδέτερος.',X:'Λαβή λίγο πιο ανοιχτή από τους ώμους, καρποί ίσιοι — τα χέρια κρατούν τη μπάρα στη θέση της, δεν τη σηκώνουν.',A:'Δείχνουν κάτω, κάτω από τη μπάρα.',B:'Μεγάλη ανάσα και σφίξιμο της κοιλιάς πριν κατέβεις, εκπνοή αφού περάσεις το δύσκολο σημείο.',F:'Τετρακέφαλοι και γλουτοί: σπρώξε το πάτωμα με όλο το πέλμα.'},

bulgarian:{P:'Μπροστινό πόδι αρκετά μπροστά ώστε στο κάτω σημείο η κνήμη να είναι σχεδόν κάθετη· πίσω πόδι με τη ράχη του πέλματος στον πάγκο.',G:'Το μπροστινό γόνατο ακολουθεί τη μύτη, δεν κλείνει μέσα· το πίσω κατεβαίνει προς το πάτωμα.',L:'Λεκάνη ίσια και στραμμένη μπροστά.',K:'Κορμός όρθιος ή με μικρή κλίση μπροστά, στήθος έξω.',W:'Ώμοι κάτω και χαλαροί.',H:'Βλέμμα μπροστά.',X:'Αλτήρες στο πλάι με ουδέτερη λαβή, χέρια τεντωμένα.',B:'Εισπνοή καθώς κατεβαίνεις, εκπνοή καθώς ανεβαίνεις.',F:'Τετρακέφαλοι και γλουτοί του μπροστινού ποδιού.'},
lunge:{P:'Μεγάλο βήμα μπροστά, πόδια στο πλάτος των ισχίων (όχι στην ίδια γραμμή).',G:'Το μπροστινό γόνατο πάνω από τη μέση του πέλματος· το πίσω κατεβαίνει σχεδόν ως το πάτωμα.',L:'Λεκάνη ίσια, μέση ουδέτερη.',K:'Κορμός όρθιος, στήθος έξω.',W:'Ώμοι κάτω και χαλαροί.',H:'Βλέμμα μπροστά.',X:'Αλτήρες στο πλάι με ουδέτερη λαβή.',B:'Εισπνοή καθώς κατεβαίνεις, εκπνοή καθώς ανεβαίνεις.',F:'Γλουτοί και τετρακέφαλοι: σπρώξε με τη φτέρνα του μπροστινού ποδιού.'},
legext:{P:'Ο κύλινδρος πάνω από τους αστραγάλους.',G:'Ευθυγραμμισμένα με τον άξονα του μηχανήματος.',L:'Πισινός κολλημένος στο κάθισμα.',K:'Πλάτη στο στήριγμα.',X:'Κράτα τις πλαϊνές λαβές για να μη σηκώνεσαι.',B:'Εκπνοή καθώς τεντώνεις, εισπνοή καθώς κατεβάζεις.',F:'Τετρακέφαλοι: κράτα ένα δευτερόλεπτο στο πάνω σημείο.'},

calf:{P:'Η μπάλα του πέλματος στην άκρη του σκαλοπατιού, στο πλάτος των ισχίων, μύτες ευθεία.',G:'Ίσια αλλά όχι κλειδωμένα.',L:'Ουδέτερη μέση.',K:'Κορμός όρθιος.',W:'Ώμοι κάτω.',H:'Βλέμμα μπροστά.',X:'Αλτήρες στο πλάι με ουδέτερη λαβή (ή το ένα χέρι σε στήριγμα).',B:'Εκπνοή καθώς ανεβαίνεις, εισπνοή καθώς κατεβαίνεις.',F:'Γαστροκνήμιοι: πλήρες τέντωμα κάτω, ψηλά στις μύτες πάνω.'},
rdl:{P:'Στο πλάτος των ισχίων, μύτες ευθεία, βάρος στη μέση του πέλματος και στις φτέρνες.',G:'Ελαφρά λυγισμένα και σταθερά — δεν λυγίζουν περισσότερο καθώς κατεβαίνεις.',L:'Ο πισινός πηγαίνει πίσω («έξω κώλος»), μέση ουδέτερη σε όλη την κίνηση.',K:'Στήθος έξω· κατέβα μέχρι ο κορμός να γίνει σχεδόν παράλληλος με το πάτωμα και η μπάρα να φτάσει στο πάνω μισό της κνήμης. Η μπάρα δεν ακουμπά το πάτωμα· αν η μέση αρχίζει να στρογγυλεύει νωρίτερα, σταμάτα εκεί.',W:'Ωμοπλάτες σφιγμένες, ώμοι πίσω.',H:'Λαιμός στη γραμμή της πλάτης.',X:'Πρηνισμένη λαβή στο πλάτος των ώμων, χέρια τεντωμένα, η μπάρα γλιστρά κολλητά στους μηρούς.',A:'Τεντωμένοι.',B:'Ανάσα και σφίξιμο της κοιλιάς πριν κατέβεις, εκπνοή στο πάνω σημείο.',F:'Οπίσθιοι μηριαίοι και γλουτοί: ανέβα σπρώχνοντας τα ισχία μπροστά.'},
hipthrust:{P:'Στο πλάτος των ισχίων, τόσο κοντά ώστε στο πάνω σημείο οι κνήμες να είναι κάθετες, μύτες ελαφρά έξω.',G:'Περίπου 90° στο πάνω σημείο, δεν κλείνουν προς τα μέσα.',L:'Στο πάνω σημείο η λεκάνη γέρνει ελαφρά πίσω (σφιγμένοι γλουτοί), χωρίς καμάρα στη μέση.',K:'Η πλάτη ακουμπά στον πάγκο κάτω από τις ωμοπλάτες· κορμός και μηροί σε ευθεία στο πάνω σημείο.',W:'Ακουμπούν στον πάγκο, σταθεροί.',H:'Πηγούνι προς το στήθος, βλέμμα μπροστά — όχι στο ταβάνι.',X:'Τα χέρια κρατούν τη μπάρα σταθερή πάνω στη λεκάνη (με μαξιλαράκι).',B:'Εκπνοή καθώς σηκώνεις, εισπνοή καθώς κατεβαίνεις.',F:'Γλουτοί: σφίξε τους στο πάνω σημείο.'},
abduction:{P:'Τα πόδια στα στηρίγματα, εξωτερική πλευρά των γονάτων στα μαξιλάρια.',L:'Πισινός στο κάθισμα.',K:'Πλάτη στο στήριγμα ή με μικρή κλίση μπροστά για περισσότερη δουλειά των γλουτών.',X:'Κράτα τις πλαϊνές λαβές.',B:'Εκπνοή καθώς ανοίγεις, εισπνοή καθώς κλείνεις.',F:'Μέσος γλουτιαίος.'},
legraise:{P:'Πόδια ενωμένα.',G:'Ίσια ή λυγισμένα για πιο εύκολη εκδοχή.',L:'Στο πάνω σημείο η λεκάνη γέρνει προς τα πίσω (τυλίγεται), ώστε να δουλεύουν οι κοιλιακοί και όχι μόνο οι καμπτήρες του ισχίου.',K:'Κορμός σταθερός, χωρίς αιώρηση.',W:'Ώμοι ενεργοί, μακριά από τα αυτιά.',H:'Βλέμμα μπροστά.',X:'Πρηνισμένη λαβή στο πλάτος των ώμων.',B:'Εκπνοή καθώς ανεβάζεις τα πόδια, εισπνοή καθώς κατεβάζεις.',F:'Κοιλιακοί: ανέβασε τα πόδια με έλεγχο, κατέβασέ τα αργά.'},
mpress:{P:'Στο πλάτος των ισχίων, μύτες ελαφρά έξω, βάρος σε όλο το πέλμα.',G:'Τεντωμένα, όχι κλειδωμένα· δεν λυγίζουν για ώθηση.',L:'Γλουτοί σφιγμένοι, μέση ουδέτερη — καμία καμάρα.',K:'Στήθος έξω, κοιλιακοί σφιχτοί.',W:'Στο πάνω σημείο «σπρώξε» τους ώμους προς τα πάνω, κάτω από τη μπάρα.',H:'Το κεφάλι πηγαίνει λίγο πίσω για να περάσει η μπάρα και μετά επιστρέφει κάτω από αυτήν.',X:'Πρηνισμένη λαβή λίγο πιο ανοιχτή από τους ώμους, μπάρα στη βάση της παλάμης, καρποί ίσιοι.',A:'Λίγο μπροστά από τη μπάρα στο ξεκίνημα, κάτω από τους καρπούς.',B:'Ανάσα και σφίξιμο της κοιλιάς πριν σπρώξεις, εκπνοή στο πάνω σημείο.',F:'Πρόσθιοι και μέσοι δελτοειδείς: η μπάρα ανεβαίνει σε ευθεία γραμμή.'},
arnold:{P:'Πέλματα σταθερά στο έδαφος.',L:'Πισινός και πλάτη στον πάγκο, μέση ουδέτερη.',K:'Στήθος έξω.',W:'Ώμοι κάτω, μακριά από τα αυτιά.',H:'Κεφάλι στον πάγκο, βλέμμα μπροστά.',X:'Στο ξεκίνημα παλάμες προς εσένα, στο πάνω σημείο παλάμες μπροστά· καρποί ίσιοι σε όλη την περιστροφή.',A:'Ξεκινούν μπροστά από το σώμα και ανοίγουν στο πλάι καθώς ανεβαίνεις.',B:'Εκπνοή καθώς σπρώχνεις, εισπνοή καθώς κατεβάζεις.',F:'Πρόσθιοι και μέσοι δελτοειδείς.'},
frontraise:{P:'Στο πλάτος των ισχίων.',G:'Ελαφρά λυγισμένα.',L:'Ουδέτερη μέση, γλουτοί σφιχτοί.',K:'Κορμός όρθιος, ακίνητος.',W:'Ώμοι κάτω, δεν ανεβαίνουν προς τα αυτιά.',H:'Βλέμμα μπροστά.',X:'Παλάμες προς τα κάτω (προς τους μηρούς στο ξεκίνημα), καρποί ίσιοι.',A:'Ελαφρά λυγισμένοι και σταθεροί.',B:'Εκπνοή καθώς ανεβάζεις, εισπνοή καθώς κατεβάζεις.',F:'Πρόσθιος δελτοειδής.'},
cablelat:{P:'Στο πλάτος των ισχίων, πλάγια στην τροχαλία.',G:'Ελαφρά λυγισμένα.',L:'Ουδέτερη μέση.',K:'Κορμός όρθιος· δεν γέρνει μακριά από την τροχαλία.',W:'Ο ώμος που δουλεύει μένει κάτω· η ωμοπλάτη δεν ανεβαίνει.',H:'Βλέμμα μπροστά.',X:'Ουδέτερη λαβή, καρπός ίσιος· το ελεύθερο χέρι στο ισχίο ή στο μηχάνημα.',A:'Ελαφρά λυγισμένος, οδηγεί την κίνηση ως το ύψος του ώμου.',B:'Εκπνοή καθώς ανεβάζεις, εισπνοή καθώς κατεβάζεις.',F:'Μέσος δελτοειδής, με τάση σε όλη τη διαδρομή.'},
rdfly:{P:'Στο πλάτος των ισχίων.',G:'Ελαφρά λυγισμένα, σταθερά.',L:'Κάμψη από τα ισχία, πισινός πίσω, μέση ουδέτερη.',K:'Κορμός σχεδόν παράλληλος με το πάτωμα, στήθος έξω, ακίνητος.',W:'Ώμοι κάτω· δεν σφίγγεις τις ωμοπλάτες μεταξύ τους.',H:'Βλέμμα στο πάτωμα, λαιμός ουδέτερος.',X:'Ουδέτερη λαβή (παλάμες αντικριστά), καρποί ίσιοι.',A:'Ελαφρά λυγισμένοι και σταθεροί· τα χέρια ανοίγουν στο πλάι.',B:'Εκπνοή καθώς ανοίγεις, εισπνοή καθώς κατεβάζεις.',F:'Οπίσθιοι δελτοειδείς.'},
shrug:{P:'Στο πλάτος των ισχίων.',G:'Ελαφρά λυγισμένα.',L:'Ουδέτερη μέση.',K:'Κορμός όρθιος, στήθος έξω.',W:'Ανεβαίνουν κατακόρυφα προς τα αυτιά και κατεβαίνουν κατακόρυφα — χωρίς κυκλική κίνηση.',H:'Κεφάλι ουδέτερο· το πηγούνι δεν πηγαίνει μπροστά.',X:'Αλτήρες στο πλάι με ουδέτερη λαβή, χέρια τεντωμένα.',A:'Τεντωμένοι σε όλη την κίνηση.',B:'Εκπνοή καθώς ανεβαίνουν οι ώμοι, εισπνοή καθώς κατεβαίνουν.',F:'Άνω τραπεζοειδής.'},
chinup:{P:'Πόδια ενωμένα και ακίνητα.',L:'Γλουτοί και κοιλιακοί σφιχτοί.',K:'Στήθος ψηλά προς τη μπάρα.',W:'Ξεκίνα κατεβάζοντας τις ωμοπλάτες.',H:'Λαιμός ουδέτερος· το πηγούνι περνά τη μπάρα χωρίς να τεντώνεται.',X:'Υπτιασμένη λαβή (παλάμες προς εσένα) στο πλάτος των ώμων, καρποί ίσιοι.',A:'Κατεβαίνουν μπροστά και προς τα πλευρά.',B:'Εκπνοή καθώς ανεβαίνεις, εισπνοή καθώς κατεβαίνεις.',F:'Πλατύς ραχιαίος και δικέφαλοι.'},
deadlift:{P:'Στο πλάτος των ισχίων, η μπάρα πάνω από τη μέση του πέλματος, μύτες ελαφρά έξω.',G:'Λυγισμένα ώστε οι κνήμες να ακουμπούν τη μπάρα· σπρώχνουν ελαφρά προς τα έξω.',L:'Ισχία ψηλότερα από τα γόνατα και χαμηλότερα από τους ώμους, μέση ουδέτερη — ποτέ στρογγυλή.',K:'Στήθος έξω, κοιλιακοί σφιχτοί.',W:'Ώμοι λίγο μπροστά από τη μπάρα, ωμοπλάτες σφιγμένες («τσέπες στις μασχάλες»).',H:'Λαιμός στη γραμμή της πλάτης, βλέμμα στο πάτωμα λίγο μπροστά.',X:'Πρηνισμένη λαβή αμέσως έξω από τα γόνατα, χέρια τεντωμένα, καρποί ίσιοι.',A:'Τεντωμένοι — δεν τραβάς με τα χέρια.',B:'Μεγάλη ανάσα και σφίξιμο της κοιλιάς πριν σηκώσεις, εκπνοή στο πάνω σημείο.',F:'Γλουτοί, οπίσθιοι μηριαίοι και ραχιαίοι: σπρώξε το πάτωμα με τα πόδια.'},
pushup:{P:'Στις μύτες, ενωμένα ή στο πλάτος των ισχίων.',G:'Τεντωμένα.',L:'Γλουτοί και κοιλιακοί σφιχτοί· η λεκάνη στη γραμμή του σώματος.',K:'Σώμα σαν σανίδα από το κεφάλι ως τις φτέρνες.',W:'Στο πάνω σημείο σπρώξε το πάτωμα μακριά (οι ωμοπλάτες ανοίγουν), στο κάτω σημείο πλησιάζουν.',H:'Λαιμός ουδέτερος, βλέμμα στο πάτωμα λίγο μπροστά από τα χέρια.',X:'Παλάμες στο πάτωμα λίγο πιο ανοιχτά από τους ώμους, δάχτυλα μπροστά.',A:'Περίπου 45° από τον κορμό.',B:'Εισπνοή καθώς κατεβαίνεις, εκπνοή καθώς σπρώχνεις.',F:'Μείζων θωρακικός και τρικέφαλοι.'},
dbbench:{P:'Πέλματα σταθερά στο έδαφος.',L:'Πισινός στον πάγκο, μικρή φυσική καμάρα.',K:'Στήθος έξω.',W:'Ωμοπλάτες πίσω και κάτω, ακουμπούν στον πάγκο.',H:'Κεφάλι στον πάγκο.',X:'Παλάμες μπροστά (προς τα πόδια), αλτήρας στη βάση της παλάμης, καρποί ίσιοι.',A:'Περίπου 45–60° από τον κορμό, κάτω από τους καρπούς.',B:'Εισπνοή καθώς κατεβάζεις, εκπνοή καθώς σπρώχνεις.',F:'Μείζων θωρακικός: νιώσε τη διάταση στο κάτω σημείο.'},
pecdeck:{P:'Πέλματα στο έδαφος.',L:'Πισινός στο κάθισμα, μέση ουδέτερη.',K:'Πλάτη στο στήριγμα, στήθος έξω.',W:'Ώμοι κάτω και πίσω, ακουμπούν στο στήριγμα.',H:'Κεφάλι ουδέτερο.',X:'Ουδέτερη λαβή (κάθετες χειρολαβές), καρποί ίσιοι.',A:'Ελαφρά λυγισμένοι, στο ύψος του στήθους.',B:'Εκπνοή καθώς κλείνεις, εισπνοή καθώς ανοίγεις.',F:'Μείζων θωρακικός.'},
skull:{P:'Πέλματα σταθερά στο έδαφος.',L:'Πισινός στον πάγκο.',K:'Στήθος έξω.',W:'Ακίνητοι, ακουμπούν στον πάγκο.',H:'Κεφάλι στον πάγκο.',X:'Πρηνισμένη λαβή στο πλάτος των ώμων ή στενότερα, καρποί ίσιοι.',A:'Δείχνουν προς το ταβάνι (ή ελαφρά προς το κεφάλι) και μένουν ακίνητοι, στο πλάτος των ώμων.',B:'Εισπνοή καθώς κατεβάζεις, εκπνοή καθώς τεντώνεις.',F:'Τρικέφαλοι.'},
cablecurl:{P:'Στο πλάτος των ισχίων, κοντά στην τροχαλία.',G:'Ελαφρά λυγισμένα.',L:'Ουδέτερη μέση, χωρίς φόρα.',K:'Κορμός όρθιος.',W:'Ώμοι κάτω και πίσω.',H:'Βλέμμα μπροστά.',X:'Υπτιασμένη λαβή, καρποί ίσιοι.',A:'Κολλημένοι στα πλευρά.',B:'Εκπνοή καθώς ανεβάζεις, εισπνοή καθώς κατεβάζεις.',F:'Δικέφαλοι, με σταθερή τάση στη διαδρομή.'},
kickback:{P:'Στο πλάτος της λεκάνης, και τα δύο πόδια στο πάτωμα.',G:'Ελαφρά λυγισμένα.',L:'Κάμψη από τα ισχία, μέση ουδέτερη.',K:'Κορμός σχεδόν παράλληλος, στηριγμένος στο ελεύθερο χέρι.',W:'Ο ώμος σταθερός· ο βραχίονας κοντά στο πλευρό, παράλληλος με τον κορμό, με τον αγκώνα ελάχιστα έξω ώστε ο αλτήρας να περνά δίπλα από το ισχίο.',H:'Βλέμμα στο πάτωμα.',X:'Ουδέτερη λαβή, καρπός ίσιος· ελαφρύς αλτήρας.',A:'Ο αγκώνας μένει ακίνητος ψηλά· κινείται μόνο ο πήχης.',B:'Εκπνοή καθώς τεντώνεις, εισπνοή καθώς λυγίζεις.',F:'Τρικέφαλοι: σφίξε στο πλήρες τέντωμα.'},
preacher:{P:'Πέλματα στο έδαφος.',L:'Πισινός στο κάθισμα.',K:'Στήθος ακουμπά στο μαξιλάρι.',W:'Μασχάλες στην πάνω άκρη του μαξιλαριού, ώμοι κάτω.',H:'Βλέμμα στη μπάρα.',X:'Υπτιασμένη λαβή στο πλάτος των ώμων, καρποί ίσιοι.',A:'Ακουμπούν στο μαξιλάρι σε όλη την κίνηση.',B:'Εκπνοή καθώς ανεβάζεις, εισπνοή καθώς κατεβάζεις.',F:'Δικέφαλοι, ιδιαίτερα στο κάτω μέρος της κίνησης.'},
goblet:{P:'Λίγο πιο ανοιχτά από τους ώμους, μύτες έξω (15–30°), όλο το πέλμα στο έδαφος.',G:'Ακολουθούν τις μύτες· στο κάτω σημείο μένουν έξω από τους αγκώνες.',L:'Πισινός κάτω ανάμεσα στις φτέρνες, μέση ουδέτερη.',K:'Στήθος ψηλά, κορμός όσο πιο όρθιος γίνεται.',W:'Ώμοι κάτω και πίσω.',H:'Βλέμμα μπροστά.',X:'Κράτα τον αλτήρα κάθετα από τον πάνω δίσκο με τις δύο παλάμες.',A:'Δείχνουν κάτω, κοντά στο σώμα.',B:'Ανάσα και σφίξιμο της κοιλιάς πριν κατέβεις, εκπνοή καθώς ανεβαίνεις.',F:'Τετρακέφαλοι και γλουτοί.'},
stepup:{P:'Ολόκληρο το πέλμα του μπροστινού ποδιού στον πάγκο, μύτη ευθεία.',G:'Το γόνατο ακολουθεί τη μύτη, δεν κλείνει μέσα.',L:'Λεκάνη ίσια.',K:'Κορμός με μικρή κλίση μπροστά, στήθος έξω.',W:'Ώμοι κάτω.',H:'Βλέμμα μπροστά.',X:'Αλτήρες στο πλάι με ουδέτερη λαβή.',B:'Εκπνοή καθώς ανεβαίνεις, εισπνοή καθώς κατεβαίνεις.',F:'Γλουτός και τετρακέφαλος του ποδιού πάνω στον πάγκο.'},
adduction:{P:'Τα πόδια στα στηρίγματα, εσωτερική πλευρά των γονάτων στα μαξιλάρια.',L:'Πισινός στο κάθισμα.',K:'Πλάτη στο στήριγμα.',X:'Κράτα τις πλαϊνές λαβές.',B:'Εκπνοή καθώς κλείνεις, εισπνοή καθώς ανοίγεις.',F:'Προσαγωγοί.'},
glutekick:{P:'Το πόδι στήριξης ελαφρά λυγισμένο, μύτη ευθεία.',G:'Του ποδιού που δουλεύει σχεδόν τεντωμένο.',L:'Λεκάνη ίσια και στραμμένη στο μηχάνημα· η μέση δεν κάνει καμάρα στο τέλος.',K:'Μικρή κλίση μπροστά, κοιλιακοί σφιχτοί.',W:'Ώμοι κάτω.',H:'Βλέμμα στο μηχάνημα.',X:'Κράτα το μηχάνημα με τα δύο χέρια.',B:'Εκπνοή καθώς σπρώχνεις πίσω, εισπνοή στην επιστροφή.',F:'Μέγας γλουτιαίος.'},
sumosq:{P:'Πολύ πιο ανοιχτά από τους ώμους, μύτες έξω 30–45°, όλο το πέλμα στο έδαφος.',G:'Ανοίγουν προς τα έξω, πάνω από τις μύτες σε όλη την κίνηση.',L:'Η λεκάνη κατεβαίνει κάθετα ανάμεσα στις φτέρνες, μέση ουδέτερη.',K:'Κορμός σχεδόν όρθιος, στήθος ψηλά.',W:'Ώμοι κάτω και πίσω.',H:'Βλέμμα μπροστά.',X:'Τα δύο χέρια στη λαβή του αλτήρα, χέρια τεντωμένα και χαλαρά.',B:'Εισπνοή καθώς κατεβαίνεις, εκπνοή καθώς ανεβαίνεις.',F:'Προσαγωγοί, γλουτοί και τετρακέφαλοι.'},

  if(AN&&AN.ex&&AN.cv.isConnected)poseAnim(t);
  else{const st=document.getElementById('stage');if(st)st.innerHTML=fig(e,t,'Κίνηση: '+e.n)}
  if(more)anim.raf=requestAnimationFrame(frame)}
function navEx(d){const L=ui.nav,i=L.indexOf(anim.id);if(L.length<2||i<0)return;
  if(V&&V.raf){cancelAnimationFrame(V.raf);V.raf=0}if(AN&&AN.raf){cancelAnimationFrame(AN.raf);AN.raf=0;AN.goal=null}cancelAnimationFrame(anim.raf);
  const f=document.activeElement&&document.activeElement.dataset&&document.activeElement.dataset.act==='exnav';openEx(L[(i+d+L.length)%L.length]);
  if(f){const n=document.querySelector(`#ov [data-act=exnav][data-v="${d}"]`);if(n)n.focus()}}
function closeEx(){anim.id=null;VE=null;if(V&&V.raf){cancelAnimationFrame(V.raf);V.raf=0}if(AN&&AN.raf){cancelAnimationFrame(AN.raf);AN.raf=0;AN.goal=null}cancelAnimationFrame(anim.raf);document.getElementById('ov').hidden=true;document.body.style.overflow=''}

// ---------- Ενέργειες ----------
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  if(a==='open'){if(!b.closest('#ov'))ui.nav=[...new Set([...document.querySelectorAll('#root [data-act=open]')].map(x=>x.dataset.v))];return openEx(v)}
  if(a==='exnav')return navEx(+v);
  if(a==='libclr'){ui.q='';render();const q=document.getElementById('libq');if(q)q.focus();return}
  if(a==='close')return closeEx();
  if(a==='msel')return select3d(v,true);
  if(a==='view')return view3d(v);
  if(a==='aview')return viewAnim(v);
  if(a==='pp'){if(anim.seg!==null){anim.seg=null;anim.pos=0;anim.play=true}else anim.play=!anim.play;b.textContent=anim.play?'Παύση':'Αναπαραγωγή';
    cancelAnimationFrame(anim.raf);if(anim.play){anim.t0=performance.now()-(anim.pos||0)*aDur();anim.raf=requestAnimationFrame(frame)}return}
  if(a==='slow'){const pos=anim.pos||0;anim.slow=!anim.slow;b.setAttribute('aria-pressed',anim.slow);anim.t0=performance.now()-pos*aDur();return}
  if(a==='sgo')return goSeg(+v);
  if(a==='snext'||a==='sprev')return goSeg((anim.seg??Math.max(0,anim.step))+(a==='snext'?1:-1));
  if(a==='tab'){ui.tab=v;ui.swap=null;if(v==='day'&&b.closest('nav'))ui.date=TODAY;window.scrollTo(0,0)}
  if(a==='date')ui.date=addD(ui.date,+v);
  if(a==='goto'){ui.date=v;ui.tab='day';window.scrollTo(0,0)}
  if(a==='cat')ui.cat=v;
  if(a==='swap')ui.swap=ui.swap===v?null:v;
  if(a==='pick'){const w=b.dataset.w,i=b.dataset.i;S.swaps[w]=S.swaps[w]||{};if(v)S.swaps[w][i]=v;else delete S.swaps[w][i];ui.swap=null;save()}
  if(a==='done'){if(S.done[ui.date])delete S.done[ui.date];else S.done[ui.date]=planFor(ui.date);save()}
  if(a==='mv'){const i=+b.dataset.i,j=i+ +v;if(j>=0&&j<7){if(perWeek()){const mon=monday(ui.date),q=S.wk[mon]||weekPlan(mon).p;[q[i],q[j]]=[q[j],q[i]];S.wk[mon]=q}else[S.days[i],S.days[j]]=[S.days[j],S.days[i]];save()}}
  if(a==='wkreset'){delete S.wk[monday(ui.date)];save()}
  if(a==='wavail'){const mon=monday(ui.date),q=waFor(mon).slice();q[+v]=q[+v]?0:1;S.wa[mon]=q;save()}
  if(a==='wsuggest'){const mon=monday(ui.date),q=waFor(mon).slice();if(!q.some(Boolean))ui.wErr=1;else{S.wa[mon]=q;S.wk[mon]=suggest({...S.set,avail:q});save()}}
  if(a==='cant'){const d=ui.date,mon=monday(d),i=dow(d);
    if(S.set.mode==='dates'){S.off[d]=v;const f=weekPlan(mon).inf[i];if(f.lost)ui.cantMsg='Δεν υπάρχει ελεύθερη διαθέσιμη μέρα στην ίδια εβδομάδα, οπότε η προπόνηση παραλείπεται.'}
    else{const q=weekPlan(mon).p,w=q[i];q[i]=null;if(v==='move'){const k=nextFree(q,i,mon);if(k>=0){q[k]=w;ui.cantMsg=`Η προπόνηση μετατέθηκε την ${fmt(addD(mon,k))}.`}else ui.cantMsg='Δεν υπάρχει ελεύθερη διαθέσιμη μέρα στην ίδια εβδομάδα, οπότε η προπόνηση παραλείπεται.'}S.wk[mon]=q}
    save()}
  if(a==='offmode')ui.offMode=v;
  if(a==='offdel'){delete S.off[v];save()}
  if(a==='offtog'){S.off[v]=S.off[v]==='move'?'skip':'move';save()}
  if(a==='offadd'){const f=(document.getElementById('off-from')||{}).value,to=(document.getElementById('off-to')||{}).value||f;
    if(!f)ui.offErr='Διάλεξε ημερομηνία.';else if(f<TODAY)ui.offErr='Μπορείς να δηλώσεις μόνο σημερινές ή μελλοντικές μέρες.';else if(to<f)ui.offErr='Η τελική ημερομηνία είναι πριν από την αρχική.';
    else{const n=Math.round((pd(to)-pd(f))/864e5);if(n>90)ui.offErr='Το διάστημα μπορεί να είναι έως 90 μέρες.';else{for(let k=0;k<=n;k++)S.off[addD(f,k)]=ui.offMode||'move';ui.offF=ui.offT='';save()}}}
  if(a==='resuggest'){const mon=monday(ui.tab==='week'?ui.date:TODAY);
    if(S.set.mode==='flex'){const q=waFor(mon).slice();if(q.some(Boolean)){S.wa[mon]=q;S.wk[mon]=suggest({...S.set,avail:q})}}
    else{S.days=suggest(S.set);if(S.set.mode==='week')delete S.wk[mon]}
    save();ui.tab='week';ui.date=mon<monday(TODAY)?TODAY:ui.date;window.scrollTo(0,0)}
  if(a==='clrswap'){S.swaps={};save()}
  if(a==='newcycle'){S.start=monday(TODAY);save()}
  if(a==='set'){const k=b.dataset.k;
    if(k==='mode'&&v!==S.set.mode){const cur=monday(TODAY),old=weekPlan(cur).p;S.set.mode=v;S.set.modeFrom=cur;
      if((v==='week'||v==='flex')&&!S.wk[cur])S.wk[cur]=old;if(v==='flex'&&!S.wa[cur])S.wa[cur]=S.set.avail.slice()}
    else if(k!=='mode'){S.set[k]=['mins','n','bwEvery'].includes(k)?+v:v;if(k==='ag')S.set.age=null}save()}
  if(a==='age'){const inp=document.getElementById(v),n=parseInt(String(inp&&inp.value||'').trim(),10);
    if(n>=10&&n<=100){ui.ageErr=null;S.set.age=n;S.set.ag=null;save()}else ui.ageErr=v}
  if(a==='setlv'){S.set.level=v;S.lvSkip=null;save()}
  if(a==='skiplv'){S.lvSkip=v;save()}
  if(a==='bw'){const inp=document.getElementById(v),n=parseFloat(String(inp&&inp.value||'').replace(',','.'));
    if(n>25&&n<350){ui.bwErr=null;S.bw=S.bw.filter(x=>x.d!==TODAY);S.bw.push({d:TODAY,kg:Math.round(n*10)/10});S.bw.sort((x,y)=>x.d<y.d?-1:1);save()}else ui.bwErr=v}
  if(a==='ht'){const inp=document.getElementById(v),n=parseFloat(String(inp&&inp.value||'').replace(',','.'));
    if(n>=100&&n<=250){ui.htErr=null;S.set.h=Math.round(n);save()}else ui.htErr=v}
  if(a==='more')ui.more=!ui.more;
  if(a==='ms'){const t={};let bad=null;
    for(const k in MS){const el=document.getElementById('ms-'+k),raw=String(el&&el.value||'').trim();if(!raw)continue;
      const n=parseFloat(raw.replace(',','.'));if(!(n>=MS[k][1]&&n<=MS[k][2])){bad=k;break}t[k]=Math.round(n*10)/10}
    if(bad)ui.msErr=bad;else if(!Object.keys(t).length)ui.msErr='none';
    else{ui.msErr=null;let e=S.ms.find(x=>x.d===TODAY);if(!e){e={d:TODAY};S.ms.push(e)}Object.assign(e,t);S.ms.sort((x,y)=>x.d<y.d?-1:1);save()}}
  if(a==='avail'){S.set.avail[+v]=S.set.avail[+v]?0:1;save()}
  if(a==='bkexport')bkExport();
  if(a==='bkimport'){const f=document.getElementById('bkfile');if(f)f.click();return}
  render()});
document.addEventListener('toggle',ev=>{if(ev.target.id==='cool')ui.cool=ev.target.open},true);
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='bkfile'){if(t.files&&t.files[0])bkImport(t.files[0]);t.value='';return}
  if(t.id==='off-from'||t.id==='off-to'){ui[t.id==='off-from'?'offF':'offT']=t.value;return}
  if(t.dataset.day!==undefined){if(perWeek())setDay(monday(ui.date),+t.dataset.day,t.value||null);else S.days[+t.dataset.day]=t.value||null;save();render();return}
  if(t.dataset.log){const id=t.dataset.log,i=+t.dataset.i,f=+t.dataset.f,d=ui.date;
    const n=parseFloat(String(t.value).replace(',','.'));
    S.logs[id]=S.logs[id]||{};const day=S.logs[id][d]=S.logs[id][d]||[];
    while(day.length<=i)day.push([0,0]);day[i]=day[i]||[0,0];day[i][f]=n>0?n:0;
    if(!day.some(x=>x&&(x[0]||x[1]))){delete S.logs[id][d];if(!Object.keys(S.logs[id]).length)delete S.logs[id]}
    save()}});
document.addEventListener('keydown',ev=>{if(anim.id===null)return;if(ev.key==='Escape')return closeEx();
  if((ev.key==='ArrowLeft'||ev.key==='ArrowRight')&&!/^(INPUT|SELECT|TEXTAREA)$/.test((ev.target.tagName||''))&&!ev.altKey&&!ev.metaKey&&!ev.ctrlKey){ev.preventDefault();navEx(ev.key==='ArrowLeft'?-1:1)}});
render();
if('serviceWorker' in navigator)window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})});
</script>
